name: Build TikTok Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Theos & SDK
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        curl -L https://github.com/theos/sdks/archive/master.zip -o /tmp/master.zip
        unzip /tmp/master.zip -d /tmp/
        mkdir -p $HOME/theos/sdks
        mv /tmp/sdks-master/*.sdk $HOME/theos/sdks/
        rm /tmp/master.zip
        rm -rf /tmp/sdks-master

    - name: Build Tweak (Dylib)
      run: |
        export THEOS=$HOME/theos
        make

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AxiomTikTok-Dylib
        path: .theos/obj/**/*.dylib
